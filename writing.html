<!doctype html>
<html lang="en">
<head>

  <script>
    (function(){
      var t = localStorage.getItem('theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="nav">
    <a class="wordmark" href="/">Simon Navarrete</a>

      <nav>
        <a href="/">About</a>
        <a href="/writing.html" aria-current="page">Writing</a>
      </nav>
      <button id="theme" class="toggle" aria-label="Toggle dark mode" aria-pressed="false"></button>
    </div>
  </header>

  <main>
    <p>I write occasionally on <a href="https://tarrasquemag.substack.com/" target="_blank" rel="noopener noreferrer">Substack</a>.</p>
  </main>

  <script src="/site.js"></script>
</body>
</html>
