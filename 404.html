<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Simon Navarrete</title>
  <meta name="description" content="Page not found.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/s-favicon-32.png">
  <link rel="apple-touch-icon" sizes="256x256" href="/assets/icons/s-webclip-256.png">
  <script>
    (function(){
      var t = localStorage.getItem('theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="nav">
    <a class="wordmark" href="/">Simon Navarrete</a>
    <div class="nav-right">
      <nav>
        <a href="/">About</a>
        <a href="/work.html">Work</a>
        <a href="/writing.html">Writing</a>
      </nav>
      <button id="theme" class="toggle" aria-label="Toggle dark mode" aria-pressed="false"></button>
    </div>
  </header>

  <main>
    <p>Page not found. <a href="/">Return home</a>.</p>
  </main>

  <script>
    var btn = document.getElementById('theme');
    var sync = function(){
      btn.setAttribute('aria-pressed',
        document.documentElement.getAttribute('data-theme') === 'dark');
    };
    sync();
    btn.addEventListener('click', function(){
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      sync();
    });
  </script>
</body>
</html>
